# ============================================================
# A股市场情绪评分系统 V2 配置
# 权重和应为 1.0; 缺数据的分量会自动按当日可用分量重新归一化
# ============================================================

index:
  primary: "1.000001"      # 量价分量所用指数(上证指数, 东财secid: 市场.代码, 1=沪 0=深)
  secondary: "0.399106"    # 用于两市成交额合计(深证综指)

# 口径说明: 涨停/跌停/炸板家数为主源同花顺涨停复盘(沪深主板+创业板+科创板),
# 历史约一年滚动(当前起点2025-10); 东财专题(不含ST/科创板, 仅近月)作近月兜底。
pool_start: "20251015"     # 涨停池回补起始日(同花顺历史边界附近)
pool_min_periods: 60       # 池分量分位的起步窗口(池历史短于量价, 提前生效)
index_start: "20150101"    # 指数日线起始日

window: 250                # 滚动分位标准化窗口(交易日)
smooth: 3                  # EMA平滑周期(与通达信EMA口径一致: alpha=2/(N+1))

# ---- 分量权重 ----
# V2.1结构(与通达信 QXXF_情绪分V2.1 同构): 量能20 动量28 位置20 波动12;
# 该公式中的"广度20%"(两市涨跌家数)历史无免费数据源, 由涨停结构组(同花顺)替代。
# 量能为非对称方向化(放量×方向, 缩量恒负/涨减半); RSI分位化。
weights:
  # 涨停结构组 20% (替代通达信V2.1的广度组)
  zt_count: 0.04        # 涨停家数 分位(正)
  dt_count: 0.04        # 跌停家数 分位(反)
  zb_rate: 0.04         # 炸板率 分位(反)
  lb_max: 0.04          # 连板高度 分位(正)
  jl_rate: 0.04         # 接力率 分位(正, 赚钱效应代理)
  # 量能组 20% (非对称方向化)
  vol_total: 0.12       # 两市成交量(手) 分位×方向
  vr: 0.08              # 5/20日量比趋势 分位×方向
  # 动量组 28%
  rsi: 0.10             # 14日RSI 分位(正)
  chg: 0.08             # 当日涨跌幅 分位
  gap: 0.05             # 跳空缺口(竞价情绪) 分位
  kr: 0.05              # K线实体强度 分位
  # 位置组 20%
  bias20: 0.08          # 20日乖离 分位
  bias60: 0.05          # 60日乖离 分位
  close: 0.07           # N日价格位置
  # 波动组 12%
  amp: 0.12             # 振幅分位×当日方向

# V1(通达信量价版)对照权重 —— 复现通达信 QXXF V1 线性口径(量能无方向)
v1_weights:
  rsi_lin: 0.20
  chg: 0.15
  bias20: 0.15
  vol_und: 0.15
  vr_und: 0.10
  close: 0.10
  amp: 0.15

# 分档阈值(升序)与标签
thresholds: [-80, -60, -30, -10, 10, 30, 60, 80]

fetch:
  sleep: 0.4             # 涨停池接口请求间隔(秒), 防限流

# ---- 板块温度计权重 (S6, 与大盘情绪同构方法论) ----
sector_weights:
  # 动量 26%
  rsi: 0.10             # 14日RSI 分位
  chg: 0.08             # 当日涨幅 分位
  gap: 0.04             # 跳空缺口 分位
  kr: 0.04              # K线实体 分位
  # 量能 21%
  vol_dir: 0.12         # 成交额分位×方向(非对称: 放量×方向, 缩量恒负/涨减半)
  vr: 0.09              # 5/20量比趋势 分位×方向(非对称)
  # 位置 17%
  bias20: 0.08
  bias60: 0.04
  pos: 0.05             # 250日价格位置
  # 波动 12%
  amp: 0.12             # 振幅分位×当日方向
  # 涨停结构 19%
  zt: 0.10              # 板块涨停家数 分位
  zt_share: 0.05        # 板块涨停占全市场比重 分位
  ud_ratio: 0.04        # 板块涨跌家数比 分位(积累制, 常缺自动降权)
  # 资金流 5%
  fflow: 0.05           # 板块主力净流入 60日分位(数据约120日, min_periods=30)
