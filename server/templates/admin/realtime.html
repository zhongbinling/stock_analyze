{% extends "base.html" %}
{% block title %}实时行情 · {{ app_name }}{% endblock %}
{% block content %}
<section class="card">
  <h2>实时行情 <span class="hint" id="rtState">加载中…</span>
    <span style="float:right;font-size:12px" class="hint">
      <label class="chk"><input type="checkbox" id="rtEnabled" checked> 采集开关(交易时段)</label>
      回看 <input class="input" id="rtDate" type="date" style="width:140px">
      <button class="btn small" id="btnDay">查看</button>
      <button class="btn small" id="btnToday">回到当日</button>
      <span id="rtDaysList" class="hint"></span>
    </span>
  </h2>
  <p class="hint" id="rtSummary">--</p>
  <div id="bannerReplay" class="hint" style="display:none;padding:4px 8px;border:1px dashed var(--line,#bbb);border-radius:6px;margin-bottom:6px">
    回看模式
  </div>
  <div id="chartMain" style="height:660px"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <div id="chartScore" style="height:240px;flex:1;min-width:300px"></div>
    <div id="chartScoreZoom" style="height:240px;flex:1;min-width:300px"></div>
    <div id="chartEtf" style="height:240px;flex:1;min-width:280px"></div>
  </div>
  <p class="hint">分时=采样点(盘中15s/档) · 实时情绪与收盘评分同口径(R2算法) · ETF=8只国家队当日累计成交额 vs 昨日总量 · 盘后与节假日自动停采, 历史日可回看</p>
</section>

<script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
<script>
const CSRF = document.querySelector('meta[name="csrf-token"]').content;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const charts = {main: null, score: null, etf: null};
let viewDate = null;                       // null=当日实时
const theme = () => (document.documentElement.dataset.theme === 'dark' ? 'dark' : null);

function chartOpt(el) {
  return {animation: false, backgroundColor: 'transparent',
          textStyle: {fontFamily: 'inherit'}};
}
function axisCommon() {
  const c = theme() === 'dark' ? '#8a8f98' : '#898781';
  return {axisLabel: {color: c}, splitLine: {lineStyle: {color: theme() === 'dark' ? '#2a2d33' : '#eee'}}};
}
function render(data) {
  // D1-25: 渲染窗 09:30~15:00(剔盘中启动的盘前tick/尾部), 累计序列显示
  // 单调化(cummax, 源毛刺回退不进图)
  const cummax = (arr) => { let m = -Infinity; return arr.map(v =>
    v == null ? null : (m = Math.max(m, v))); };
  const S = (data.samples || []).filter(x => x.t >= '09:30' && x.t <= '15:01');
  // 定轴断块: 全日固定242分钟槽(09:30~11:30 + 13:00~15:00, 剔午休·同花顺
  // 口径) — 轴恒满幅, 曲线到当前时点自然截止; 同分钟多tick取末值对齐槽
  const SLOTS = (() => {
    const out = [];
    for (let t = 9 * 60 + 30; t <= 11 * 60 + 30; t++)
      out.push(`${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`);
    for (let t = 13 * 60; t <= 15 * 60; t++)
      out.push(`${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`);
    return out;
  })();
  const bySlot = new Map();                     // 槽 → 该分钟末值样本
  for (const x of S) bySlot.set(x.t.slice(0, 5), x);
  const A = SLOTS.map(t => bySlot.get(t) || {t});   // 242槽对齐数组(缺槽null字段)
  // D1-27: 同花顺式时间轴 — 半小时刻度(:00/:30) + 竖虚线
  const TICKS = new Set(['09:30', '10:00', '10:30', '11:00', '11:30',
                         '13:00', '13:30', '14:00', '14:30', '15:00']);
  const thsIv = (i, v) => TICKS.has(v.slice(0, 5))
    && (i === 0 || ts[i - 1].slice(0, 5) !== v.slice(0, 5));
  const thsX = (visible) => ({type: 'category', data: ts, show: visible,
    axisLine: { lineStyle: { color: '#898781' } }, axisTick: { show: visible, interval: thsIv },
    axisLabel: visible ? { color: '#898781', interval: thsIv, formatter: v => v.slice(0, 5) } : undefined,
    splitLine: { show: visible, interval: thsIv,
                 lineStyle: { color: theme() === 'dark' ? '#2a2d33' : '#e8e8e8', type: 'dashed' } }});

  const ts = SLOTS;
  const last = S[S.length - 1] || {};
  const meta = data.meta || {};
  // ── 图1: 上证分时(上价格/下量额双grid, 同花顺式 D1-23b) ──
  const vols = [];                                   // 分钟量(万手, cumvol差分跨缺槽携带)
  let pv = null, pc = null;
  for (const x of A) {
    if (x.cumvol != null) {
      vols.push(pv != null                           // 首样本cumvol为开盘累计, 差分=假尖峰
        ? {value: [x.t, Math.max(0, (x.cumvol - pv) / 1e4)],
           itemStyle: {color: x.close != null && pc != null && x.close >= pc ? '#e34448' : '#1baf7a'}}
        : {value: [x.t, null]});
      pv = x.cumvol; pc = x.close;
    } else vols.push({value: [x.t, null]});
  }
  const yd = (meta.yday && meta.yday.points) || null;   // 昨日累计额(官方额锚定)
  const ydLine = A.map(x => yd ? (yd[x.t] ?? null) : null);
  charts.main = charts.main || echarts.init($('chartMain'), theme());
  charts.main.setOption({
    ...chartOpt(),
    grid: [{left: 56, right: 56, top: 28, height: 210},        // 价格
           {left: 56, right: 56, top: 272, height: 110},       // 累计额(今/昨)
           {left: 56, right: 56, top: 416, height: 180}],      // 分钟量(独立刻度)
    legend: {data: ['上证', '分钟量(万手)', '今日累计额(亿)', '昨日累计额(亿)'],
             textStyle: {fontSize: 11}},
    tooltip: {trigger: 'axis'},
    axisPointer: {link: [{xAxisIndex: 'all'}]},
    xAxis: [Object.assign({}, thsX(false), {gridIndex: 0}),   // D1-27: 同花顺刻度
            Object.assign({}, thsX(false), {gridIndex: 1}),
            Object.assign({}, thsX(true), {gridIndex: 2})],
    yAxis: [{type: 'value', scale: true, name: '指数', gridIndex: 0,
             axisLabel: {color: '#898781'}},
            {type: 'value', gridIndex: 1, name: '亿',
             axisLabel: {color: '#898781'}, splitLine: {show: false}},
            {type: 'value', gridIndex: 2, name: '万手',
             axisLabel: {color: '#898781'}, splitLine: {show: false}}],
    series: [
      {name: '上证', type: 'line', xAxisIndex: 0, yAxisIndex: 0,
       data: A.map(x => x.close ?? null), showSymbol: false,
       lineStyle: {width: 1.6, color: '#2f5cd6'}, itemStyle: {color: '#2f5cd6'},
       markLine: meta.prev_close ? {silent: true, symbol: 'none',
         label: {formatter: '昨收 {c}', fontSize: 10},
         lineStyle: {type: 'dashed', color: '#e34448'},
         data: [{yAxis: meta.prev_close}]} : undefined},
      {name: '今日累计额(亿)', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
       data: cummax(A.map(x => x.cumamt ?? null)), showSymbol: false,
       lineStyle: {width: 1.4, color: '#eda100'}, itemStyle: {color: '#eda100'}},
      {name: '昨日累计额(亿)', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
       data: cummax(ydLine), showSymbol: false, connectNulls: true,
       lineStyle: {width: 1.2, color: '#898781', type: 'dashed'},
       itemStyle: {color: '#898781'}},
      {name: '分钟量(万手)', type: 'bar', xAxisIndex: 2, yAxisIndex: 2,
       data: vols, barMaxWidth: 3}],
  }, true);
  // ── 图2: 实时情绪双图(全幅 + 开盘基准±20放大镜) ──
  const scoreData = A.map(x => x.score ?? null);
  const scOpen = scoreData.find(v => v != null);
  charts.score = charts.score || echarts.init($('chartScore'), theme());
  charts.score.setOption({
    ...chartOpt(), grid: {left: 40, right: 14, top: 26, bottom: 40},
    title: {text: '实时情绪分(与收盘同口径)', left: 4, top: 2, textStyle: {fontSize: 11, color: '#898781'}},
    tooltip: {trigger: 'axis'},
    xAxis: thsX(true),
    yAxis: {type: 'value', min: -105, max: 105, ...axisCommon()},
    series: [{name: '实时情绪', type: 'line', data: scoreData,
      showSymbol: true, symbolSize: 3,   // R5: 盘后补采仅收盘点, 无符号不可见
      lineStyle: {width: 1.8, color: '#6250d6'}, itemStyle: {color: '#6250d6'},
      areaStyle: {opacity: 0.06},
      markLine: {silent: true, symbol: 'none', label: {show: false},
        lineStyle: {type: 'dashed', color: '#bbb'}, data: [{yAxis: 0}]}}],
  }, true);
  // D1-26: 放大镜 — 以开盘情绪为基准±20窗(clip截越界段, 日内波动可见性×5)
  charts.zoom = charts.zoom || echarts.init($('chartScoreZoom'), theme());
  charts.zoom.setOption({
    ...chartOpt(), grid: {left: 40, right: 14, top: 26, bottom: 40},
    title: {text: scOpen != null
        ? `波动放大(开盘${scOpen >= 0 ? '+' : ''}${scOpen} ±20)` : '波动放大',
            left: 4, top: 2, textStyle: {fontSize: 11, color: '#898781'}},
    tooltip: {trigger: 'axis'},
    xAxis: thsX(true),
    yAxis: scOpen != null
      ? {type: 'value', min: scOpen - 20, max: scOpen + 20, ...axisCommon()}
      : {type: 'value', ...axisCommon()},
    series: [{name: '情绪(放大)', type: 'line', data: scoreData,
      showSymbol: false, clip: true,
      lineStyle: {width: 1.6, color: '#e34448'}, itemStyle: {color: '#e34448'},
      markLine: scOpen != null ? {silent: true, symbol: 'none',
        label: {formatter: '开盘', fontSize: 10},
        lineStyle: {type: 'dashed', color: '#898781'},
        data: [{yAxis: scOpen}]} : undefined}],
  }, true);
  // ── 图3: ETF 当日累计 vs 昨日分钟对照 ──
  charts.etf = charts.etf || echarts.init($('chartEtf'), theme());
  const etfNow = last.etf, etfPrev = meta.prev_etf_yi;
  const yde = (meta.yday_etf && meta.yday_etf.points) || null;
  const ydeLine = A.map(x => yde ? (yde[x.t] ?? null) : null);
  charts.etf.setOption({
    ...chartOpt(), grid: {left: 44, right: 14, top: 26, bottom: 40},
    title: {text: '宽基ETF累计成交(亿) vs 昨日', left: 4, top: 2, textStyle: {fontSize: 11, color: '#898781'}},
    tooltip: {trigger: 'axis'},
    xAxis: thsX(true),
    yAxis: {type: 'value', scale: true, ...axisCommon()},
    series: [
      {name: '当日累计', type: 'line', data: cummax(A.map(x => x.etf ?? null)), showSymbol: false,
       lineStyle: {width: 1.8, color: '#1baf7a'}, itemStyle: {color: '#1baf7a'},
       areaStyle: {opacity: 0.08},
       markLine: etfPrev ? {silent: true, symbol: 'none',
         label: {formatter: '昨日总量 {c}亿', fontSize: 10},
         lineStyle: {type: 'dashed', color: '#e34448'},
         data: [{yAxis: etfPrev}]} : undefined},
      {name: '昨日累计', type: 'line', data: cummax(ydeLine),
       showSymbol: false, connectNulls: true,
       lineStyle: {width: 1.2, color: '#898781', type: 'dashed'},
       itemStyle: {color: '#898781'}}],
  }, true);
  // ── 状态行 ──
  const pct = etfNow && etfPrev ? ` · ETF达成昨日 ${Math.round(etfNow / etfPrev * 100)}%` : '';
  $('rtSummary').innerHTML =
    `${viewDate ? '存档' : (data.live ? '● 盘中实时' : '○ 盘后/休市')} `
    + `${esc(data.date || '--')} 更新 ${esc(data.updated_at || '--')} · 采样 ${S.length} 点`
    + (last.close ? ` · 上证 ${last.close}` : '')
    + (last.score != null ? ` · 情绪 <b>${last.score > 0 ? '+' : ''}${last.score}</b> [${esc(last.stage || '')}] 涨停${last.zt ?? '--'}` : '')
    + `${esc(pct)}`;
}

async function api(url) {
  const r = await fetch(url);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || ('HTTP ' + r.status));
  return j;
}

async function loadDays() {
  try {
    const d = await api('/admin/api/rt/days');
    // D1-27: 近5交易日chips(日历化) — 有档可点, 无档灰化点击提示
    const have = new Set(d.days || []);
    const recent = d.recent && d.recent.length ? d.recent : (d.days || []).slice(0, 5);
    $('rtDaysList').innerHTML = recent.map(x =>
      `<a href="javascript:void(0)" class="btn small" data-day="${x}"
         style="margin-left:4px;${have.has(x) ? '' : 'opacity:.4'}"
         title="${have.has(x) ? '查看存档' : '该日无存档(功能上线前或未采集)'}">${x.slice(5)}</a>`).join('')
      + ((d.days || []).length > recent.length ? ` <span class="hint">共${d.days.length}日存档</span>` : '');
    document.querySelectorAll('#rtDaysList [data-day]').forEach(a =>
      a.onclick = () => {
        viewDate = a.dataset.day; $('rtDate').value = a.dataset.day;
        document.querySelectorAll('#rtDaysList [data-day]').forEach(x => x.style.fontWeight = '');
        a.style.fontWeight = 'bold';
        load();
      });
  } catch (e) {}
}

$('btnDay').onclick = () => {
  const v = $('rtDate').value;
  if (!v) { alert('请选择日期'); return; }
  viewDate = v; load();
};
$('btnToday').onclick = () => { viewDate = null; load();
  document.querySelectorAll('#rtDaysList [data-day]').forEach(x => x.style.fontWeight = ''); };
$('rtEnabled').onchange = async () => {
  try {
    const r = await fetch('/admin/api/rt/settings', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF},
      body: JSON.stringify({enabled: $('rtEnabled').checked})});
    const j = await r.json();
    $('rtState').textContent = j.msg || '';
  } catch (e) { $('rtState').textContent = e.message; }
};

window.addEventListener('resize', () =>
  Object.values(charts).forEach(c => c && c.resize()));

// 主题切换(theme.js只改data-theme不重载) → dispose重建, 否则暗色下轴/字不可读
new MutationObserver(() => {
  Object.values(charts).forEach(c => c && c.dispose());
  charts.main = charts.score = charts.etf = charts.zoom = null;   // D1-26r: zoom同置空
  load();
}).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

loadDays();
// 刷新节奏自适应: 盘中live 10s / 平时30s / 页面隐藏60s — 每次load后按
// 返回的 live 态重排下一轮(回看模式固定30s)
let timer = null, lastLive = false;
const schedule = (ms) => { clearTimeout(timer); timer = setTimeout(load, ms); };
async function load() {
  try {
    const data = viewDate ? await api('/admin/api/rt/day?date=' + viewDate)
                          : await api('/admin/api/rt/latest');
    $('bannerReplay').style.display = viewDate ? '' : 'none';
    if (!viewDate && data.enabled != null) $('rtEnabled').checked = !!data.enabled;
    render(data);
    lastLive = !!data.live;
    // D1-27: 状态角标 — 盘中实时/已就绪(显示日)/回看; 不再常驻"加载中"
    $('rtState').textContent = viewDate ? `回看 ${viewDate}`
      : (data.live ? '● 盘中实时' : (data.fallback ? `已就绪 · 显示 ${data.date}`
        : '已就绪'));
    if (!viewDate && data.fallback)
      $('bannerReplay').style.display = '',
      $('bannerReplay').textContent = `非采集时段 — 显示最近交易日 ${data.date} 存档(采集开关保持)`;
  } catch (e) { $('rtSummary').textContent = e.message; }
  schedule(document.hidden ? 60000 : (!viewDate && lastLive ? 10000 : 30000));
}
load();
</script>
{% endblock %}
